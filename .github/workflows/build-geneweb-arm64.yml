name: Build GeneWeb ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: GeneWeb 7.1.0-beta2 ARM64
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout GeneWeb
        uses: actions/checkout@v5
        with:
          repository: geneweb/geneweb
          ref: v7.1.0-beta2
          path: geneweb

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            opam \
            build-essential \
            git \
            m4 \
            patch \
            pkg-config \
            libgmp-dev \
            libpcre2-dev \
            xdot

      - name: Initialize opam
        run: |
          opam init --bare --disable-sandboxing -y
          opam switch create geneweb ocaml-base-compiler.4.14.2 -y

      - name: Install GeneWeb dependencies
        working-directory: geneweb
        run: |
          eval "$(opam env --switch=geneweb)"
          opam option depext=false
          opam install . --deps-only -y

      - name: Configure GeneWeb
        working-directory: geneweb
        run: |
          eval "$(opam env --switch=geneweb)"
          ocaml ./configure.ml

      - name: Build GeneWeb
        working-directory: geneweb
        run: |
          eval "$(opam env --switch=geneweb)"
          make distrib

      - name: Verify ARM64 binaries
        working-directory: geneweb
        run: |
          echo "Architecture du runner :"
          uname -m

          echo
          echo "gwd :"
          file distribution/gw/gwd

          echo
          echo "gwsetup :"
          file distribution/gw/gwsetup

          echo
          echo "gwc :"
          file distribution/gw/gwc

          echo
          echo "gwu :"
          file distribution/gw/gwu

          echo
          echo "Test de gwd :"
          distribution/gw/gwd -help >/dev/null

          echo "GeneWeb ARM64 fonctionne."

      - name: Create ARM64 archive
        working-directory: geneweb
        run: |
          tar -czf ../geneweb-7.1.0-beta2-linux-arm64.tar.gz distribution

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geneweb-7.1.0-beta2-linux-arm64
          path: geneweb-7.1.0-beta2-linux-arm64.tar.gz
